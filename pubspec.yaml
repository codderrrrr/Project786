name: subscription_saas_flutter
description: Subscription Management SaaS - Flutter Mobile Frontend (UI + dummy data, backend-ready)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4

  decimal: ^3.0.2
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_annotation: ^2.6.1

flutter:
  uses-material-design: true

  # Space Grotesk carries the product's voice: headings, section labels and
  # every money figure. Body text stays on the platform face (Roboto on
  # Android), which is the most readable option at small sizes.
  # Licensed under the SIL Open Font License 1.1 — see
  # assets/fonts/SpaceGrotesk-OFL.txt.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
